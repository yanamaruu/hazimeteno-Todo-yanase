<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Minimal ToDo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h2>ToDo List</h2>
        </header>

        <form id="todo-form" class="input-group">
            <input type="text" id="todo-input" placeholder="新しいタスク..." required>
            <button type="submit" id="add-btn">追加</button>
        </form>

        <section class="list-section">
            <ul id="todo-list"></ul>
        </section>
    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
